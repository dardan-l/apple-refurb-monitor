name: refurb-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: refurb-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MATCH_ALL: ${{ vars.MATCH_ALL || 'mac mini,m4 pro,48gb' }}
          MATCH_ANY: ${{ vars.MATCH_ANY || '' }}
          MIN_LISTINGS: ${{ vars.MIN_LISTINGS || '50' }}
        run: python3 refurb_monitor.py

      - name: Commit state if changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update state.json"
            git push
          else
            echo "state.json unchanged"
          fi
